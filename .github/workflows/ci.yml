name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests (race)
        run: go test -race ./internal/...
      - name: E2E user scenarios
        run: go test ./e2e/ -v
        env:
          SQUIZ_E2E_REPORT: ${{ github.workspace }}/e2e-report.md
      - name: goreleaser config check
        uses: goreleaser/goreleaser-action@v6
        with:
          args: check
      - name: Plugin manifests are valid JSON
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool plugins/squiz/.claude-plugin/plugin.json > /dev/null
      - name: Install script syntax + lint
        run: |
          sh -n plugins/squiz/scripts/install.sh
          shellcheck plugins/squiz/scripts/install.sh
      - name: Doc references resolve
        run: python3 scripts/check-doc-refs.py --ci
      - name: Plugin skill stays in sync with repo skill
        run: |
          diff \
            <(sed -n '/^# squiz — /,$p' .claude/skills/squiz/SKILL.md) \
            <(sed -n '/^# squiz — /,$p' plugins/squiz/skills/squiz/SKILL.md) \
          || { echo '::error::plugins/squiz/skills/squiz/SKILL.md 의 프로토콜 본문(# squiz — 이하)이 .claude/skills/squiz/SKILL.md 와 다릅니다. 두 파일을 함께 수정하세요.'; exit 1; }
      - name: Post E2E scenario report as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ github.workspace }}/e2e-report.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- squiz-e2e-report -->';
            let body;
            try {
              body = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            } catch (e) {
              body = '## 🧪 squiz E2E 사용자 시나리오 검증\n\n⚠️ 리포트 파일이 생성되지 않았습니다 — E2E 단계가 시작 전에 실패했을 수 있습니다. 워크플로 로그를 확인하세요.';
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            body = `${marker}\n${body}\n---\n_커밋 ${context.sha.slice(0, 7)} · [워크플로 실행](${runUrl}) · \`go test ./e2e/\`로 로컬 재현 가능_\n`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const prev = comments.find(c => c.body && c.body.includes(marker));
            if (prev) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prev.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
